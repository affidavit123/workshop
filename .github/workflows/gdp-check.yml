name: Mongolia GDP Growth Check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-gdp:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run GDP check script
        run: python scripts/check_gdp.py

      - name: Commit updated state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mini_state.json
          git diff --staged --quiet || git commit -m "Update mini_state.json"
          git push
